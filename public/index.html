<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Travel Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f4f8;
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar {
      background-color: #fff;
      border-bottom: 1px solid #e2e8f0;
    }
    .navbar-brand {
      font-weight: 700;
      color: #1A2B3C;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* CARDS */
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .card-header-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6c757d;
      margin-bottom: 0.25rem;
    }
    .card h5 {
      font-size: 1rem;
      font-weight: 600;
    }

    /* FORM */
    .form-control:focus, .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.12);
    }
    .form-label {
      font-size: 0.82rem;
      font-weight: 500;
      color: #495057;
    }

    /* TRIP CARD */
    .trip-card {
      border-left: 4px solid #30404F;
      border-radius: 12px;
      background: #fff;
      padding: 1rem 1.25rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }
    .trip-card .destination {
      font-size: 1rem;
      font-weight: 700;
      color: #1a1a2e;
    }
    .trip-card .dates {
      font-size: 0.8rem;
      color: #6c757d;
    }
    .trip-card .notes {
      font-size: 0.82rem;
      color: #495057;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      margin-top: 0.5rem;
      font-style: italic;
    }

    /* WEATHER BADGE */
    .weather-badge {
      background: #e0f0ff;
      border: 1px solid #bde0fe;
      border-radius: 10px;
      padding: 0.6rem 0.9rem;
      font-size: 0.82rem;
      color: #0369a1;
    }
    .weather-badge .temp {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0d6efd;
    }

    /* ACTION BUTTONS */
    .btn-edit {
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
    }
    .btn-delete {
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
    }

    /* SECTION LABELS */
    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #adb5bd;
      margin-bottom: 0.75rem;
    }

    .btn-add-trip {
      background-color: #30404F;
      color: #fff;
      width: 100%;
      border-radius: 0.75rem;
    }

    .btn-add-trip:hover {
      background-color: #1A2B3C;
      color: #fff;
    }

    .itinerary-card {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 145px);
    }

    #trips-scroll {
      overflow-y: auto;
      padding-right: 8px;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
    }

    .search-dropdown {
      position: relative;
      margin-top: 0.25rem;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid #dee2e6;
      border-radius: 0.5rem;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .search-option {
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .search-option:hover {
      background-color: #f1f4f8;
    }

    #map { flex: 0 0 auto; }
    #trips-container { display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar px-4 py-3 mb-4">
    <span class="navbar-brand">
      <i class="bi bi-geo-alt-fill"></i> Smart Travel Planner
    </span>
    <div class="d-flex align-items-center gap-3">
  <div class="text-muted d-flex align-items-center" id="welcome-msg">Welcome, User!</div>
  <a href="login.html" onclick="sessionStorage.clear();" class="btn btn-outline-danger btn-sm rounded-pill">
    <i class="bi bi-box-arrow-right me-1"></i>Logout
  </a>
</div>
  </nav>

  <!-- MAIN CONTENT -->
 <div class="container pb-5">
    <div class="row g-4">

      <div class="col-lg-5">
        <form id="trip-form" class="card p-4">
          <p class="card-header-title" id="form-title-label">Add a New Trip</p>
          <h5 class="mb-4" id="form-main-title">Plan Your Journey</h5>

          <div class="mb-3">
            <label class="form-label">Destination</label>
            <div class="row g-2">
              <div class="col-12">
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-flag text-primary"></i></span>
                  <input type="text" id="countryInput" class="form-control" placeholder="Country" autocomplete="off" required />
                </div>
                <div id="countryDropdown" class="search-dropdown d-none"></div>
              </div>
              <div class="col-12">
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-building text-primary"></i></span>
                  <input type="text" id="cityInput" class="form-control" placeholder="City" autocomplete="off" disabled required />
                </div>
                <div id="cityDropdown" class="search-dropdown d-none"></div>
              </div>
            </div>
            <input type="hidden" id="destination" />
          </div>

          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label">Start Date</label>
              <input type="date" id="start-date" class="form-control" required />
            </div>
            <div class="col-6">
              <label class="form-label">End Date</label>
              <input type="date" id="end-date" class="form-control" required />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">Personal Notes</label>
            <textarea id="notes" class="form-control" rows="3" placeholder="Things to do, places to visit..."></textarea>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-add-trip fw-medium">Add Trip to Itinerary</button>
        </form>
      </div>

     <div class="col-lg-7">
        <div class="card p-4 itinerary-card">
          <p class="card-header-title">My Itinerary</p>
          <h5 class="mb-4">Your Trips</h5>

          <div id="trips-scroll">
            <div id="map" class="mb-4" style="height: 250px; border-radius: 12px; display: none; border: 1px solid #e2e8f0;"></div>

            <div id="trips-container"></div>

            <div class="text-center text-muted py-4 d-none" id="empty-state">
              <i class="bi bi-map fs-2 mb-2 d-block"></i>
              <p class="small">No trips yet. Add one on the left!</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
