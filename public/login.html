<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Smart Travel Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      background-color: #1A2B3C;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.75rem;
    }
    .form-control:focus {
      border-color: #1A2B3C;
      box-shadow: 0 0 0 0.2rem rgba(26, 43, 60, 0.15);
    }
    .btn-primary {
      background-color: #1A2B3C;
      border-color: #1A2B3C;
    }
    .btn-primary:hover {
      background-color: #16202b;
      border-color: #16202b;
    }
  </style>
</head>
<body>

<div class="container" style="max-width: 440px;">

  <div class="text-center mb-4">
    <div class="brand-icon">
      <i class="bi bi-geo-alt-fill text-white fs-4"></i>
    </div>
    <h1 class="h4 fw-semibold mb-1">Smart Travel Planner</h1>
    <p class="text-muted small">Plan your next adventure</p>
  </div>

  <div class="card shadow-sm border-0 rounded-4 p-4">
    <h5 class="fw-semibold mb-1">Welcome back</h5>
    <p class="text-muted small mb-3">Sign in to continue planning your trips</p>

    <div id="login-alert" class="alert alert-danger d-none py-2 small"></div>

    <div class="mb-3">
      <label for="login-email" class="form-label small fw-medium">Email</label>
      <input type="email" class="form-control" id="login-email" placeholder="you@example.com" />
      <div class="invalid-feedback">Please enter a valid email.</div>
    </div>

    <div class="mb-3">
      <label for="login-password" class="form-label small fw-medium">Password</label>
      <div class="input-group">
        <input type="password" class="form-control" id="login-password" placeholder="Enter your password" />
        <button class="btn btn-outline-secondary" type="button" onclick="togglePw('login-password', this)">
          <i class="bi bi-eye"></i>
        </button>
      </div>
      <div class="text-danger small mt-1 d-none" id="login-pw-err">Password is required.</div>
    </div>

    <button class="btn btn-primary w-100 mt-1" id="login-btn" onclick="handleLogin()">
      <span class="btn-text">Sign In</span>
      <span class="spinner-border spinner-border-sm d-none ms-1" id="login-spinner"></span>
    </button>

    <p class="text-center text-muted small mt-3 mb-0">
      Don't have an account?
      <a href="register.html" style="color: #1A2B3C;" class="fw-medium text-decoration-none">Register here</a>
    </p>
  </div>
</div>

<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let token = null;

  function clearErrors() {
    document.querySelectorAll('.form-control').forEach(i => i.classList.remove('is-invalid'));
    document.querySelectorAll('.text-danger.small').forEach(e => e.classList.add('d-none'));
    document.querySelectorAll('.alert').forEach(a => a.classList.add('d-none'));
  }

  function markInvalid(inputId, errId) {
    document.getElementById(inputId).classList.add('is-invalid');
    if (errId) document.getElementById(errId).classList.remove('d-none');
  }

  function showAlert(id, msg, type = 'danger') {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `alert alert-${type} py-2 small`;
  }

  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.querySelector('i').className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
  }

  function setLoading(btnId, spinnerId, loading) {
    document.getElementById(btnId).disabled = loading;
    document.getElementById(spinnerId).classList.toggle('d-none', !loading);
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  async function handleLogin() {
    clearErrors();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    let valid = true;

    if (!isValidEmail(email)) { markInvalid('login-email'); valid = false; }
    if (!password) { markInvalid('login-password', 'login-pw-err'); valid = false; }
    if (!valid) return;

    setLoading('login-btn', 'login-spinner', true);
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Invalid credentials. Please try again.');
      token = data.token;
      sessionStorage.setItem('token', data.token);
      sessionStorage.setItem('userName', data.name);
      window.location.href = 'index.html';
    } catch (err) {
      showAlert('login-alert', err.message);
    } finally {
      setLoading('login-btn', 'login-spinner', false);
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
