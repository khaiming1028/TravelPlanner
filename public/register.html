<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Smart Travel Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      background-color: #1A2B3C;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.75rem;
    }
    .form-control:focus {
      border-color: #1A2B3C;
      box-shadow: 0 0 0 0.2rem rgba(26, 43, 60, 0.15);
    }
    .btn-primary {
      background-color: #1A2B3C;
      border-color: #1A2B3C;
    }
    .btn-primary:hover {
      background-color: #16202b;
      border-color: #16202b;
    }
  </style>
</head>
<body>

<div class="container" style="max-width: 440px;">

  <div class="text-center mb-4">
    <div class="brand-icon">
      <i class="bi bi-geo-alt-fill text-white fs-4"></i>
    </div>
    <h1 class="h4 fw-semibold mb-1">Smart Travel Planner</h1>
    <p class="text-muted small">Plan your next adventure</p>
  </div>

  <div class="card shadow-sm border-0 rounded-4 p-4">
    <h5 class="fw-semibold mb-1">Create account</h5>
    <p class="text-muted small mb-3">Join to start planning your trips</p>

    <div id="register-alert" class="alert alert-danger d-none py-2 small"></div>

    <div class="mb-3">
      <label for="reg-name" class="form-label small fw-medium">Full Name</label>
      <input type="text" class="form-control" id="reg-name" placeholder="Enter your name" />
      <div class="invalid-feedback">Name is required.</div>
    </div>

    <div class="mb-3">
      <label for="reg-email" class="form-label small fw-medium">Email</label>
      <input type="email" class="form-control" id="reg-email" placeholder="you@example.com" />
      <div class="invalid-feedback">Please enter a valid email.</div>
    </div>

    <div class="mb-3">
      <label for="reg-password" class="form-label small fw-medium">Password</label>
      <div class="input-group">
        <input type="password" class="form-control" id="reg-password" placeholder="Min. 8 characters" />
        <button class="btn btn-outline-secondary" type="button" onclick="togglePw('reg-password', this)">
          <i class="bi bi-eye"></i>
        </button>
      </div>
      <div class="form-text text-muted" style="font-size: 0.75rem;">
        Must include uppercase, number, and special character.
      </div>
      <div class="text-danger small mt-1 d-none" id="reg-pw-err">Password does not meet requirements.</div>
    </div>

    <div class="mb-3">
      <label for="reg-confirm" class="form-label small fw-medium">Confirm Password</label>
      <div class="input-group">
        <input type="password" class="form-control" id="reg-confirm" placeholder="Repeat password" />
        <button class="btn btn-outline-secondary" type="button" onclick="togglePw('reg-confirm', this)">
          <i class="bi bi-eye"></i>
        </button>
      </div>
      <div class="text-danger small mt-1 d-none" id="reg-confirm-err">Passwords do not match.</div>
    </div>

    <button class="btn btn-primary w-100 mt-1" id="register-btn" onclick="handleRegister()">
      <span class="btn-text">Create Account</span>
      <span class="spinner-border spinner-border-sm d-none ms-1" id="register-spinner"></span>
    </button>

    <p class="text-center text-muted small mt-3 mb-0">
      Already have an account?
      <a href="login.html" style="color: #1A2B3C;" class="fw-medium text-decoration-none">Sign in</a>
    </p>
  </div>
</div>

<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function clearErrors() {
    document.querySelectorAll('.form-control').forEach(i => i.classList.remove('is-invalid'));
    document.querySelectorAll('.text-danger.small').forEach(e => e.classList.add('d-none'));
    document.querySelectorAll('.alert').forEach(a => a.classList.add('d-none'));
  }

  function markInvalid(inputId, errId) {
    document.getElementById(inputId).classList.add('is-invalid');
    if (errId) document.getElementById(errId).classList.remove('d-none');
  }

  function showAlert(id, msg, type = 'danger') {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `alert alert-${type} py-2 small`;
  }

  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.querySelector('i').className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
  }

  function setLoading(btnId, spinnerId, loading) {
    document.getElementById(btnId).disabled = loading;
    document.getElementById(spinnerId).classList.toggle('d-none', !loading);
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function isStrongPassword(password) {
    return password.length >= 8 &&
      /[A-Z]/.test(password) &&
      /[0-9]/.test(password) &&
      /[!@#$%^&*_]/.test(password);
  }

  async function handleRegister() {
    clearErrors();
    const name     = document.getElementById('reg-name').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;
    let valid = true;

    if (!name)                       { markInvalid('reg-name');                       valid = false; }
    if (!isValidEmail(email))        { markInvalid('reg-email');                      valid = false; }
    if (!isStrongPassword(password)) { markInvalid('reg-password', 'reg-pw-err');     valid = false; }
    if (password !== confirm)        { markInvalid('reg-confirm', 'reg-confirm-err'); valid = false; }
    if (!valid) return;

    setLoading('register-btn', 'register-spinner', true);
    try {
      const res = await fetch('http://localhost:3000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Registration failed. Please try again.');
      showAlert('register-alert', 'Account created! Redirecting to sign in...', 'success');
      setTimeout(() => window.location.href = 'login.html', 1500);
    } catch (err) {
      showAlert('register-alert', err.message);
    } finally {
      setLoading('register-btn', 'register-spinner', false);
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleRegister();
  });
</script>
</body>
</html>
